<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="srkOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#D98B12" />
    </linearGradient>
    <linearGradient id="srkDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2F37" />
      <stop offset="100%" stop-color="#1A1D23" />
    </linearGradient>
    <filter id="srkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D98B12" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Industrial Emblem / Forklift Symbol (Left) -->
  <g transform="translate(4, 4)">
    <!-- Outer Industrial Hexagon Badge -->
    <path d="M 28 0 L 52 14 L 52 42 L 28 56 L 4 42 L 4 14 Z" 
          fill="url(#srkDarkGrad)" 
          stroke="url(#srkOrangeGrad)" 
          stroke-width="2" 
          stroke-linejoin="round" />

    <!-- Subtle Inner Accent Inset -->
    <path d="M 28 4 L 48 16 L 48 40 L 28 52 L 8 40 L 8 16 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-opacity="0.08" 
          stroke-width="1" />

    <!-- Stylized Forklift Graphic -->
    <!-- Overhead Guard & Cabin Frame -->
    <path d="M 18 36 L 18 19 L 29 19 L 33 26 L 33 36 Z" 
          fill="none" 
          stroke="#F5A623" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Operator Seat & Chassis Mass -->
    <rect x="20" y="27" width="9" height="7" rx="1.5" fill="#D98B12" />

    <!-- Vertical Heavy Triplex Mast -->
    <line x1="37" y1="12" x2="37" y2="39" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="40" y1="14" x2="40" y2="37" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round" />

    <!-- Mast Carriage Crossbars -->
    <line x1="35" y1="20" x2="41" y2="20" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="35" y1="28" x2="41" y2="28" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Fork Carriage & Heavy-Duty Lifting Tines -->
    <path d="M 39 30 L 46 30 L 46 32 L 39 32" fill="url(#srkOrangeGrad)" />
    <!-- Extended Fork Tines Blade -->
    <path d="M 40 33 L 48 33 L 48 35.5 L 38 35.5 Z" fill="#F5A623" />

    <!-- Heavy Industrial Wheels -->
    <!-- Rear Steer Wheel -->
    <circle cx="19" cy="38" r="4.5" fill="#1A1D23" stroke="#F5A623" stroke-width="1.5" />
    <circle cx="19" cy="38" r="1.5" fill="#FFFFFF" />

    <!-- Front Drive Wheel -->
    <circle cx="34" cy="38" r="5" fill="#1A1D23" stroke="#F5A623" stroke-width="2" />
    <circle cx="34" cy="38" r="2" fill="#FFFFFF" />

    <!-- Dynamic Elevation Arrow / Chevron (Top) -->
    <path d="M 24 9 L 28 5 L 32 9" fill="none" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: SHREE RANG KRUPA ENTERPRISE (Right) -->
  <g transform="translate(68, 0)">
    <!-- Primary Brand Line: SHREE RANG KRUPA -->
    <text x="0" y="27" 
          font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="18" 
          font-weight="800" 
          letter-spacing="0.8" 
          fill="#20242A">SHREE RANG <tspan fill="#F5A623">KRUPA</tspan></text>

    <!-- Accent Dot / Divider -->
    <circle cx="218" cy="22" r="3" fill="#D98B12" />

    <!-- Secondary Line: ENTERPRISE -->
    <text x="0" y="44" 
          font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="11.5" 
          font-weight="700" 
          letter-spacing="4.2" 
          fill="#D98B12">ENTERPRISE</text>

    <!-- Industrial Underline Rule -->
    <line x1="126" y1="40" x2="216" y2="40" stroke="#E5E7EB" stroke-width="1.5" stroke-linecap="round" />
    <line x1="200" y1="40" x2="216" y2="40" stroke="#F5A623" stroke-width="2" stroke-linecap="round" />

    <!-- Industrial Descriptor / Subtext -->
    <text x="0" y="55" 
          font-family="'JetBrains Mono', 'Space Grotesk', monospace, sans-serif" 
          font-size="6.8" 
          font-weight="600" 
          letter-spacing="1.6" 
          fill="#667085">INDUSTRIAL EQUIPMENT &amp; FORKLIFT SOLUTIONS</text>
  </g>
</svg>

